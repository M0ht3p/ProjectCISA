[project]
name = "projet-cisa"
version = "1.0.0"
description = "Application Streamlit d'analyse d'images et de métadonnées EXIF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.0.0",
    "exifread>=3.0.0",
    "Pillow>=9.0.0",
    "geopy>=2.0.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.13.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
